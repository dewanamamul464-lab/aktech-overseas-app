name: aktech_overseas_app
description: A Flutter app for AKTech Overseas
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # =========================================================
  # UI / ICONS
  # =========================================================

  cupertino_icons: ^1.0.8

  # =========================================================
  # LOCAL STORAGE
  # =========================================================

  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # =========================================================
  # FILES / MEDIA
  # =========================================================

  file_picker: ^11.0.3
  image_picker: ^1.1.2

  # =========================================================
  # NETWORKING
  # =========================================================

  http: ^1.2.2

  # =========================================================
  # STATE MANAGEMENT
  # =========================================================

  provider: ^6.1.2

  # =========================================================
  # COUNTRY FLAGS
  # =========================================================

  country_flags: ^4.1.2

  # =========================================================
  # HTML JOB DESCRIPTION RENDERING
  # =========================================================

  flutter_html: ^3.0.0

  # =========================================================
  # OPEN EXTERNAL LINKS
  # =========================================================

  url_launcher: ^6.3.2
  firebase_core: ^4.14.0


dev_dependencies:
  # =========================================================
  # TESTING
  # =========================================================

  flutter_test:
    sdk: flutter

  # =========================================================
  # LINTING
  # =========================================================

  flutter_lints: ^3.0.1

  # =========================================================
  # APP ICON
  # =========================================================

  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  # =========================================================
  # ASSETS
  # =========================================================

  assets:
    - assets/images/
    - assets/icons/


# =============================================================
# FLUTTER LAUNCHER ICONS
# =============================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/aktech_brand_logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/aktech_brand_logo.png"